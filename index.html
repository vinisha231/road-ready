<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RoadReady — Teen Driving Simulator</title>
<meta name="description" content="A free browser driving simulator for teens: hazard perception, parallel parking, highway merges, distracted-driving practice, and a parent dashboard. Crash here, not out there.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%230f1218'/%3E%3Ctext x='50' y='68' font-size='52' text-anchor='middle'%3E%F0%9F%9A%97%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">
  <canvas id="game"></canvas>

  <div id="hud" class="hidden">
    <div id="objective"></div>
    <div id="zoneBanner" class="hidden"></div>
    <div id="speedo"><span id="speedVal">0</span><span class="unit">mph</span></div>
    <div id="limitSign"><div class="limit-label">SPEED<br>LIMIT</div><div id="limitVal">35</div></div>
    <div id="toasts"></div>
    <div id="phone" class="hidden">📱<div id="phoneMsg">mom: where r u??</div></div>
    <div id="attempts" class="hidden"></div>
  </div>
  <div id="peekBlur" class="hidden"></div>
  <div id="replayCap" class="hidden"></div>

  <div id="menu" class="screen"></div>
  <div id="brief" class="screen hidden"></div>
  <div id="results" class="screen hidden"></div>
  <div id="parent" class="screen hidden"></div>
  <div id="pause" class="screen hidden"></div>
</div>

<script src="js/util.js"></script>
<script src="js/storage.js"></script>
<script src="js/input.js"></script>
<script src="js/car.js"></script>
<script src="js/camera.js"></script>
<script src="js/world.js"></script>
<script src="js/weather.js"></script>
<script src="js/scoring.js"></script>
<script src="js/pedestrians.js"></script>
<script src="js/hazards.js"></script>
<script src="js/traffic.js"></script>
<script src="js/phone.js"></script>
<script src="js/replay.js"></script>
<script src="js/leaderboard.js"></script>
<script src="js/unlocks.js"></script>
<script src="js/ui.js"></script>
<script src="js/parent.js"></script>
<script src="js/scenarios/base.js"></script>
<script src="js/scenarios/parking-lot.js"></script>
<script src="js/scenarios/school-zone.js"></script>
<script src="js/scenarios/highway-merge.js"></script>
<script src="js/scenarios/roundabout.js"></script>
<script src="js/scenarios/emergency.js"></script>
<script src="js/scenarios/construction.js"></script>
<script src="js/scenarios/night-rain.js"></script>
<script src="js/scenarios/parallel-parking.js"></script>
<script src="js/main.js"></script>
</body>
</html>
